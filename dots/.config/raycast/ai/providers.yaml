# Template for providers.yaml
#
# You can add any OpenAI API compatible provider to the "providers" list.
# For each provider you must also specify a list of models, along with model abilities.
#
# All fields are required unless marked as optional.
#
# Refer to your provider's API documentation for specific
# details such as model identifiers, capabilities etc
#
# Note: Since the OpenAI API is not a standard we can't guarantee that all
# providers will work correctly with Raycast AI.
#
# To use this template rename as `providers.yaml`
#
providers:
  # OpenRouter gives one API key access to models from many vendors.
  - id: tailscale
    name: Tailscale
    base_url: http://ai.vpn.rsefer.com/aperture
    additional_parameters:
      provider:
        sort: throughput
    # Specify all models to use with the current provider
    models:
      - id: anthropic/claude-sonnet-5 # `id` must match the identifier used by the provider
        name: Claude Sonnet 5 # name visible in Raycast
        provider: openrouter # Only required if mapping to a specific api key
        description: Anthropic's balanced model via OpenRouter # optional
        context: 200000 # refer to provider's API documentation
        # Optional abilities - all child properties are also optional.
        # If you specify abilities incorrectly the model may fail to work as expected in Raycast AI.
        # Refer to provider's API documentation for model abilities.
        abilities:
          temperature:
            supported: true
          vision:
            supported: true
          system_message:
            supported: true
          tools:
            supported: true
          reasoning_effort:
            supported: false
      - id: openai/gpt-5.6
        name: GPT-5.6
        description: OpenAI's flagship reasoning model via OpenRouter
        context: 400000
        abilities:
          # Reasoning models often accept only the default temperature.
          temperature:
            supported: false
          vision:
            supported: true
          system_message:
            supported: true
          tools:
            supported: true
          reasoning_effort:
            supported: true
